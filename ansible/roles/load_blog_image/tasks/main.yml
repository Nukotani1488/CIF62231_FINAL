- name: Copy image to all nodes
  become: true
  copy:
    src: /tmp/blog-image.tar.gz
    dest: /tmp/blog-image.tar.gz
    mode: '0644'

- name: Load image into containerd
  become: true
  shell: gzip -dc /tmp/blog-image.tar.gz | ctr -n k8s.io images import -

- name: Clean up image tar
  become: true
  file:
    path: /tmp/blog-image.tar.gz
    state: absent