---
- name: Check if cluster already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: Initialize cluster
  command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --cri-socket={{ cri_socket }}
  when: not kubeadm_init.stat.exists

- name: Create .kube dir for root
  file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Copy admin.conf to root
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: Create .kube dir for ansible user
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0700"

- name: Copy admin.conf to ansible user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    mode: "0600"

- import_tasks: helm.yml

- name: Install Flannel CNI
  command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: not kubeadm_init.stat.exists

- name: Get join command
  command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Store join command
  set_fact:
    kubeadm_join_command: "{{ join_command.stdout }}"